name: Library pull request validation

on:
  push:
    branches: [test/ci/verify-library-pull-requests]
    paths: [.github/workflows/library-pull-request-validation.yml]

permissions:
  contents: read

jobs:
  cpu:
    name: CPU unit tests (${{ matrix.change }})
    if: github.repository == 'A-P-S-Bhaidav/anomalib'
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        include:
          - change: VAD fixture
            head: "f613b86ddc4fe015e9bf537573f876f93676d843"
            regression: tests/unit/data/datamodule/image/test_vad.py
    env:
      BASE_SHA: "437669f437b0d552c7d8382316e49cbaff574ce8"
      PR_HEAD: ${{ matrix.head }}
      REGRESSION_PATH: ${{ matrix.regression }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.10"
      - name: Check out the exact proposed merge
        run: |
          git checkout --detach "$BASE_SHA"
          if [ "$BASE_SHA" != "$PR_HEAD" ]; then
            git -c user.name='PR validation' -c user.email='validation@example.invalid' \
              merge --no-commit --no-ff "$PR_HEAD"
          fi
          git diff --cached --check
          git diff --cached --stat
      - name: Install the frozen CPU development environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install uv==0.13.7
          uv sync --frozen --extra dev --extra cpu
          uv run --no-sync python -c 'import PIL, torch, torchvision; print(PIL.__version__, torch.__version__, torchvision.__version__)'
      - name: Run the affected regression tests
        if: matrix.regression != ''
        run: uv run --no-sync pytest -q -m 'cpu and not network' "$REGRESSION_PATH"
      - name: Run CPU unit tests
        run: >-
          uv run --no-sync pytest -q -m 'cpu and not network'
          --numprocesses=4 --dist=loadfile --timeout=150 --durations=10
          tests/unit
