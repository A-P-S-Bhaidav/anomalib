name: Contribution path validation
on:
  push:
    branches: [codex/validate-windows-pointer]
permissions:
  contents: read
jobs:
  paths:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.4
      - run: uv pip install --system pytest==9.1.1 pytest-mock==3.17.0 "platformdirs>=4.3.8,<5"
      - name: Versioned-path tests
        run: python -m pytest --confcutdir=tests/unit/utils tests/unit/utils/test_path.py -q -k "TestCreateVersionedDir or TestResolveVersionedPath"
      - name: Complete path suite on Linux
        if: runner.os == 'Linux'
        run: python -m pytest --confcutdir=tests/unit/utils tests/unit/utils/test_path.py -q
      - name: Diagnose existing Windows cache-path failure on upstream baseline
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          git show 0be85508edde53a2b1062ee6d1732c85c5b7172e:src/anomalib/utils/path.py > src/anomalib/utils/path.py
          git show 0be85508edde53a2b1062ee6d1732c85c5b7172e:tests/unit/utils/test_path.py > tests/unit/utils/test_path.py
          python -m pytest --confcutdir=tests/unit/utils tests/unit/utils/test_path.py -q -k test_rejects_absolute_path
